<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>水蘊草與水中生活 AR 實驗</title>

  <!-- 載入 A-Frame 與 MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    /* 頂部資訊卡片（與你的教學媒體視覺風格一致） */
    #ui-card {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 460px;
      background: rgba(255, 255, 255, 0.94);
      color: #244238;
      padding: 14px 18px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      z-index: 999;
    }

    #ui-card h1 {
      margin: 0 0 6px;
      font-size: 18px;
      color: #176b57;
    }

    #status-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #3b5349;
    }

    /* 底部操作面板 */
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    }

    .btn {
      border: none;
      background: #176b57;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn.secondary {
      background: #e8efeb;
      color: #244238;
    }

    .btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- 頂部狀態與觀察引導 -->
  <div id="ui-card">
    <h1>水蘊草與水中生活 AR 實驗</h1>
    <p id="status-text">📷 請允許開啟相機，並將鏡頭對準「水蘊草 AR 圖卡」。</p>
  </div>

  <!-- 底部互動按鈕 -->
  <div id="controls">
    <button class="btn" id="btnRotate">🔄 換角度</button>
    <button class="btn secondary" id="btnZoomIn">➕ 放大</button>
    <button class="btn secondary" id="btnZoomOut">➖ 縮小</button>
    <button class="btn secondary" id="btnReset">重置</button>
  </div>

  <!-- 
    請確認 ./targets.mind 與你 GitHub 內的 .mind 檔名相同 
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- 
        請確認 ./white_mesh.glb 與你 GitHub 內的 .glb 模型檔名相同 
      -->
      <a-asset-item id="plantModel" src="./waterweed.glb"></a-asset-item>
    </a-assets>

    <!-- 環境光與平行光，確保模型不會全黑或全白 -->
    <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.0" position="1 2 1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <!-- 半透明淡藍色水體示意方盒（呈現沉水環境） -->
      <a-box
        position="0 0 0.25"
        width="0.9"
        height="0.9"
        depth="0.5"
        material="color: #6bc5e8; transparent: true; opacity: 0.22; side: double">
      </a-box>

      <!-- 水蘊草 3D 模型（不再檢查特定子節點，任何 GLB 皆可正常顯示） -->
      <a-gltf-model
        id="model"
        src="#plantModel"
        position="0 0 0.2"
        scale="0.4 0.4 0.4"
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const statusText = document.getElementById('status-text');
    const target = document.getElementById('target');
    const model = document.getElementById('model');

    let currentScale = 0.4;
    let rotX = 0, rotY = 0, rotZ = 0;

    target.addEventListener('targetFound', () => {
      statusText.textContent = '🌿 已識別圖卡！可單指滑動旋轉模型，或按下方按鈕換角度觀察。';
    });

    target.addEventListener('targetLost', () => {
      statusText.textContent = '📷 請將鏡頭對準「水蘊草 AR 圖卡」以顯示模型。';
    });

    function updateTransform() {
      model.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`);
      model.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
    }

    // 換角度按鈕
    document.getElementById('btnRotate').addEventListener('click', () => {
      rotY = (rotY + 45) % 360;
      updateTransform();
    });

    // 放大按鈕
    document.getElementById('btnZoomIn').addEventListener('click', () => {
      currentScale = Math.min(1.5, +(currentScale + 0.1).toFixed(2));
      updateTransform();
    });

    // 縮小按鈕
    document.getElementById('btnZoomOut').addEventListener('click', () => {
      currentScale = Math.max(0.1, +(currentScale - 0.1).toFixed(2));
      updateTransform();
    });

    // 重置按鈕
    document.getElementById('btnReset').addEventListener('click', () => {
      currentScale = 0.4;
      rotX = 0; rotY = 0; rotZ = 0;
      updateTransform();
    });

    // 支援手指觸控拖曳旋轉與滑鼠拖曳旋轉
    let isDragging = false;
    let prevX = 0, prevY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      rotY += dx * 0.5;
      rotX -= dy * 0.5;
      updateTransform();
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
